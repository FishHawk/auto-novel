name: CD Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cd-web.yml
      - .github/workflows/ci-web.yml
      - .dockerignore
      - deploy/web/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - web/**
      - apps/admin/**
      - packages/crawler/**
      - packages/translator/**

permissions:
  contents: read

concurrency:
  group: cd-web-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_OWNER: auto-novel
  IMAGE_NAME: auto-novel-web

jobs:
  check:
    uses: ./.github/workflows/ci-web.yml

  build-and-push:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Resolve build metadata
        id: build_metadata
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          file: deploy/web/Dockerfile
          push: true
          provenance: false
          build-args: |
            VITE_COMMIT_SHA=${{ github.sha }}
            VITE_BUILD_TIME=${{ steps.build_metadata.outputs.build_time }}
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 1
