<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>轻小说机翻机器人</title>
    <meta name="description" content="一个能自动生成并分享轻小说译文的网站" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta name="theme-color" content="white" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-QD8MZ90XFJ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-QD8MZ90XFJ');
    </script>
    <script>
      // vite bug, see https://github.com/vitejs/vite/discussions/15794
      if (!('hasOwn' in Object)) {
        Object.hasOwn = Object.call.bind(Object.hasOwnProperty);
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div id="fallback-error"></div>
    </div>
    <script>
      window.onerror = function (msg, url, line, col) {
        if (String(msg).includes('ResizeObserver loop')) {
          return true;
        }

        // Vue 挂载后会替换 #app 的内容，只在挂载前显示错误。
        var fallback = document.getElementById('fallback-error');
        if (fallback) {
          var div = document.createElement('div');
          div.innerText = `Error: ${line}:${col} ${msg} ${url}`;
          fallback.appendChild(div);
        }
        return false;
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
    <noscript>本页面需要浏览器启用JavaScript</noscript>
  </body>
</html>
