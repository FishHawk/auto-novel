networks:
  default:
    name: auto-novel
    driver: bridge

services:
  web:
    image: ghcr.io/auto-novel/auto-novel-web:latest
    ports:
      - 80:80
    volumes:
      - ./data/files-temp:/data/files-temp
      - ./data/files-wenku:/data/files-wenku
      - ./data/files-extra:/data/files-extra
    restart: always

  api:
    image: ghcr.io/auto-novel/auto-novel-api:latest
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=auto-novel
      - DB_NAME=auto-novel
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      - R2_BUCKET
      - R2_PUBLIC_BASE_URL
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --spider --tries=1 --no-verbose http://localhost:8080/health || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/auto-novel/auto-novel-server:latest
    depends_on:
      - mongo
      - elasticsearch
      - redis
    environment:
      - HTTPS_PROXY
      - MAILGUN_API_KEY
      - MAILGUN_API_URL
      - MAILGUN_FROM_EMAIL
      - ACCESS_TOKEN_SECRET
      - HAMELN_TOKEN
      - PIXIV_COOKIE_PHPSESSID
      - DB_HOST_MONGO=mongo
      - DB_HOST_ES=elasticsearch
      - DB_HOST_REDIS=redis
    volumes:
      - ./data/files-temp:/data/files-temp
      - ./data/files-wenku:/data/files-wenku
      - ./data/files-extra:/data/files-extra
    restart: always

  postgresql:
    image: postgres:17.7-alpine3.23
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER=auto-novel
      - POSTGRES_DB=auto-novel
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6.0.3
    environment:
      - MONGO_INITDB_DATABASE=main
    volumes:
      - ./db/mongo-init:/docker-entrypoint-initdb.d:ro
      - ./data/db:/data/db
    restart: always

  elasticsearch:
    image: elasticsearch:8.18.1
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - 'ES_JAVA_OPTS=-Xms2g -Xmx2g'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    volumes:
      - ./data/es/data:/usr/share/elasticsearch/data
      - ./data/es/plugins:/usr/share/elasticsearch/plugins
    entrypoint: |
      bash -c "
      if ! elasticsearch-plugin list | grep -q analysis-icu; then
        elasticsearch-plugin install analysis-icu
      fi
      /usr/local/bin/docker-entrypoint.sh eswrapper
      "
    restart: always

  redis:
    image: redis:7.2.1
    restart: always
